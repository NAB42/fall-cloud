<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fall Cloud | Sign in</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="auth.js"></script>
</head>
<body data-auth-page="login" class="login-page">
  <main class="login-card">
    <div class="brand login-brand"><span class="brand-mark">F</span><span>Fall Cloud</span></div>
    <p class="eyebrow">Team workspace</p>
    <h1>Welcome back</h1>
    <p class="muted">Sign in with your Google account to access your workspace.</p>
    <button id="google-login-button" class="button button-primary login-button" type="button"><span class="google-g">G</span> Continue with Google</button>
    <p id="auth-message" class="auth-message" role="status"></p>
    <p class="login-note">Your account is authenticated securely through Firebase.</p>
  </main>
</body>
</html>
