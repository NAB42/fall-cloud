<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fall Cloud | Tasks</title>
  <link rel="stylesheet" href="../style.css">

  <!-- Firebase config -->
  <script src="../config.js"></script>

  <script type="module" defer>
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      updateDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore.js";

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // UI elements
    const newTaskBtn = document.querySelector("[data-action='new-task']");
    const dialog = document.getElementById("task-dialog");
    const form = document.getElementById("task-form");
    const taskColumns = document.getElementById("task-columns");
    const taskCount = document.getElementById("task-count");

    const STAGES = ["TO-DO", "IN-PROGRESS", "COMPLETE"];

    // Open dialog
    newTaskBtn.addEventListener("click", () => dialog.showModal());

    // Submit new task
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const data = new FormData(form);

      const task = {
        title: data.get("title"),
        description: data.get("description"),
        assignee: data.get("assignee") || "Unassigned",
        dueDate: data.get("dueDate"),
        stageId: data.get("stageId") || "TO-DO",
        createdAt: Date.now()
      };

      await addDoc(collection(db, "tasks"), task);

      dialog.close();
      form.reset();
      loadTasks();
    });

    // Load tasks from Firestore
    async function loadTasks() {
      const snapshot = await getDocs(collection(db, "tasks"));
      const tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderTasks(tasks);
    }

    // Advance task status
    async function advanceTask(task) {
      const next =
        task.stageId === "TO-DO" ? "IN-PROGRESS" :
        task.stageId === "IN-PROGRESS" ? "COMPLETE" :
        "TO-DO";

      await updateDoc(doc(db, "tasks", task.id), { stageId: next });
      loadTasks();
    }

    // Render tasks into columns
    function renderTasks(tasks) {
      taskColumns.innerHTML = "";

      STAGES.forEach(stage => {
        const col = document.createElement("section");
        col.className = "task-column";

        col.innerHTML = `
          <div class="column-heading">
            <span>${stage.replace("-", " ")}</span>
            <span>${tasks.filter(t => t.stageId === stage).length}</span>
          </div>
        `;

        const list = document.createElement("div");
        list.className = "task-list";

        tasks
          .filter(t => t.stageId === stage)
          .forEach(t => {
            const card = document.createElement("article");
            card.className = "column-task";

            card.innerHTML = `
              <h3>${t.title}</h3>
              <p>${t.description || "No description"}</p>
              <footer>
                <span>${t.assignee} · ${t.dueDate || "No date"}</span>
                <button class="text-button" data-advance="${t.id}">
                  ${t.stageId === "COMPLETE" ? "↶ Reopen" : "Advance →"}
                </button>
              </footer>
            `;

            list.appendChild(card);
          });

        col.appendChild(list);
        taskColumns.appendChild(col);
      });

      taskCount.textContent = tasks.length;

      // Bind advance buttons
      document.querySelectorAll("[data-advance]").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.advance;
          const task = tasks.find(t => t.id === id);
          advanceTask(task);
        });
      });
    }

    // Initial load
    loadTasks();
  </script>
</head>

<body data-page="tasks">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">F</span><span>Fall Cloud</span></div>
    <div class="topbar-actions">
      <span id="save-status" class="save-status">Synced to Firestore</span>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <p class="eyebrow">Workspace</p>
      <nav class="nav">
        <a class="nav-link" href="../dashboard/">⌂ <span>Dashboard</span></a>
        <a class="nav-link active" href="../tasks/">✓ <span>Tasks</span><span id="task-count" class="nav-count"></span></a>
        <a class="nav-link" href="../calendar/">◷ <span>Calendar</span></a>
        <a class="nav-link" href="../pipeline/">↗ <span>Pipeline</span></a>
        <a class="nav-link" href="../files/">▣ <span>File drop</span></a>
        <a class="nav-link" href="../whiteboard/">✎ <span>Whiteboard</span></a>
      </nav>
      <div class="sidebar-footer">
        <span class="avatar">EM</span>
        <div><strong>Team workspace</strong><small>Firestore mode</small></div>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-heading">
        <div>
          <p class="eyebrow">Work management</p>
          <h1>Tasks</h1>
          <p class="muted">Assign work, set deadlines, and move tasks through the workflow.</p>
        </div>
        <button class="button button-primary" data-action="new-task">+ New task</button>
      </div>

      <div class="toolbar">
        <label class="search-box">⌕ 
          <input id="task-search" placeholder="Search tasks...">
        </label>
        <select id="task-filter">
          <option value="ALL">All statuses</option>
          <option value="TO-DO">To-do</option>
          <option value="IN-PROGRESS">In progress</option>
          <option value="COMPLETE">Complete</option>
        </select>
      </div>

      <div id="task-columns" class="task-columns"></div>
    </main>
  </div>

  <dialog id="task-dialog">
    <form method="dialog" id="task-form">
      <div class="dialog-heading">
        <h2>New task</h2>
        <button value="cancel" class="icon-button">×</button>
      </div>

      <label>Task title
        <input name="title" required>
      </label>

      <label>Description
        <textarea name="description" rows="3"></textarea>
      </label>

      <div class="form-grid">
        <label>Assignee
          <input name="assignee">
        </label>

        <label>Due date
          <input name="dueDate" type="date">
        </label>
      </div>

      <label>Pipeline stage
        <select name="stageId">
          <option value="TO-DO">To-do</option>
          <option value="IN-PROGRESS">In progress</option>
          <option value="COMPLETE">Complete</option>
        </select>
      </label>

      <div class="dialog-actions">
        <button value="cancel" class="button button-ghost">Cancel</button>
        <button value="default" class="button button-primary">Create task</button>
      </div>
    </form>
  </dialog>
</body>
</html>
